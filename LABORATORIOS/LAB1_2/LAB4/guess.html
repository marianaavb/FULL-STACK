<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <title>Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Jogo de Adivinhação</h1>
    <p>Olá! Adivinhe o número secreto entre 0 e 99.</p>

    <!-- Espaço para digitar o palpite -->
    <input type="number" id="palpiteInput" placeholder="Digite seu palpite" min="0" max="99">

    <!-- Botão que executa a função do JavaScript -->
    <button onclick="ChecarPalpite()">Adivinhar</button>

    <!-- Local onde aparecem as dicas e o resultado -->
    <p id="resultado" aria-live="polite"></p>

    <script src="script.js"></script>
</body>
</html>
