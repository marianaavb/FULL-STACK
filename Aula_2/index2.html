<!DOCTYPE html>
<html>
    <head>
        <title>Aula 2</title>
        <meta charset="utf-8">
<!--Para linkar o arquivo de html com o css (3 forma de utilizar o css)-->
        <link href="style.css" rel="stylesheet">


<!--segue estilização para englobar todos os elementos de uma tag (2 forma de usar o css)-->

        <style>
            h1 {
                text-align: center;
            }

            p{
                background-color: whitesmoke;
            }
        </style>

    </head>

    <body>
        <h1>Aula 2</h1>

        <a class="menu" href="">Home</a>
        <a class="menu" href="">Contato</a>
        <a class="menu" href="">Noticias</a>

        <p style="color: red;">Apredendo CSS</p>
<!--colocando CSS para estilização de cor direto na tag <p> (paragrafo)- (1 forma de utilizar o css)-->

        <p style="color: blue;"> Mudando cores</p>
        <p class="vermelho tam10">Exemplo de cor 1</p>
        <p class="laranja tam16">Exemplo de cor 2</p>
        <p class="amarelo tam26">Exemplo de cor 3</p>
        <p class="verde tam36">Exemplo de cor 4</p>
        <p class="azul tam46">Exemplo de cor 5</p>

        <div>
        <a href="https://portal.fei.edu.br">Portal FEI</a>
        </div>

    </body>
</html>
